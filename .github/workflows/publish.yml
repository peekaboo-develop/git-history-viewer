name: Publish alpha

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact release tag to publish
        required: true
        default: v0.1.0-alpha.0
      normalize_only:
        description: Skip publishing and normalize prerelease dist-tags only
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify exact version tag
        run: node -e "const p=require('./package.json');if(process.env.RELEASE_REF!=='v'+p.version)process.exit(1)"
        env:
          RELEASE_REF: ${{ inputs.ref }}
      - run: npm ci
      - run: npm test
      - run: npm run license:check
      - run: npm run test:pack
      - if: ${{ !inputs.normalize_only }}
        run: npm publish --access public --tag alpha --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Normalize alpha dist-tags
        shell: bash
        run: |
          release_package="$(node -p "require('./package.json').name")"
          release_version="$(node -p "require('./package.json').version")"
          if [[ "$release_version" != *-* ]]; then
            echo "Refusing to normalize a stable version as alpha." >&2
            exit 1
          fi
          npm dist-tag add "${release_package}@${release_version}" alpha
          release_latest="$(npm view "$release_package" dist-tags.latest 2>/dev/null || true)"
          if [[ "$release_latest" == "$release_version" ]]; then
            npm dist-tag rm "$release_package" latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
